<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Patrón: Gráfico de barras</title>
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../brand.css">
</head>
<body>
  <div class="slide">
    <div class="glow sutil"></div>

    <div class="kicker"><span class="num">04 / 07</span> hagamos las cuentas</div>

    <h2 class="titulo" style="margin: 34px 0 16px;">Los descuentos<br>se <span class="acento-italic">acumulan</span>.</h2>
    <p class="cuerpo" style="margin-bottom: 48px;">El beneficio por plazo y el de cantidad se combinan.</p>

    <div class="barras">
      <div class="barra-fila">
        <div class="barra-head"><span>Anual</span><span class="valor">-15%</span></div>
        <div class="barra-track"><div class="barra-fill" style="width: 100%;"></div></div>
      </div>
      <div class="barra-fila">
        <div class="barra-head"><span>10+ máquinas</span><span class="valor">-10%</span></div>
        <div class="barra-track"><div class="barra-fill" style="width: 67%;"></div></div>
      </div>
      <div class="barra-fila">
        <div class="barra-head"><span>5+ máquinas</span><span class="valor">-6%</span></div>
        <div class="barra-track"><div class="barra-fill" style="width: 40%;"></div></div>
      </div>
      <div class="barra-fila">
        <div class="barra-head"><span>Semestral</span><span class="valor">-5%</span></div>
        <div class="barra-track"><div class="barra-fill apagada" style="width: 33%;"></div></div>
      </div>
      <div class="barra-fila">
        <div class="barra-head"><span>3+ máquinas</span><span class="valor">-3%</span></div>
        <div class="barra-track"><div class="barra-fill apagada" style="width: 20%;"></div></div>
      </div>
    </div>

    <p class="cuerpo" style="font-size: 26px; margin-top: 44px;">Nunca recortamos funciones para bajar el precio.</p>

    <div class="footer-marca"><div class="wordmark chico">POS Terominds</div></div>
  </div>
</body>
</html>
