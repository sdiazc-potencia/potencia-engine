<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Slide 6 — Los números</title>
<link rel="stylesheet" href="../../../design/fonts.css">
<link rel="stylesheet" href="../../../design/brand.css">
</head>
<body>
  <div class="slide">
    <div class="glow"></div>

    <div class="kicker" style="margin-bottom: 34px;">
      <span class="num">06 / 07</span>
      <span>— los números</span>
    </div>

    <h2 class="titulo" style="margin-bottom: 16px;">La primera semana,<br>en <span class="acento-italic">crudo.</span></h2>
    <p class="cuerpo" style="margin-bottom: 52px;">Nada de magia: volumen con puntería. El mensaje habla del negocio del otro, no del mío.</p>

    <div class="barras" style="flex: 1; justify-content: center;">
      <div class="barra-fila">
        <div class="barra-head"><span>Leads tibios generados</span><span class="valor">140</span></div>
        <div class="barra-track"><div class="barra-fill" style="width: 100%;"></div></div>
      </div>
      <div class="barra-fila">
        <div class="barra-head"><span>Respondieron</span><span class="valor">38</span></div>
        <div class="barra-track"><div class="barra-fill" style="width: 27%;"></div></div>
      </div>
      <div class="barra-fila">
        <div class="barra-head"><span>Reuniones agendadas</span><span class="valor">9</span></div>
        <div class="barra-track"><div class="barra-fill" style="width: 7%;"></div></div>
      </div>
      <div class="barra-fila">
        <div class="barra-head"><span>Clientes cerrados</span><span class="valor" style="color: var(--lavanda);">3</span></div>
        <div class="barra-track"><div class="barra-fill" style="width: 3%; min-width: 34px;"></div></div>
      </div>
      <p class="cuerpo" style="margin-top: 26px; font-size: 28px;"><strong>27% de respuesta</strong> donde el frío te da menos del 1%.</p>
    </div>

    <div class="footer-marca"><span class="wordmark" style="font-size: 32px;">potenc<span class="ia">IA</span></span></div>
  </div>
</body>
</html>
