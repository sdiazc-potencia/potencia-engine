<body>
  <div class="slide">

      <div class="wordmark">potenc<span class="ia">IA</span></div>

        <div style="width: 52px; height: 68%; border-radius: 10px; background: rgba(182,174,212,0.35);"></div>
        <div style="width: 52px; height: 85%; border-radius: 10px; background: rgba(182,174,212,0.35);"></div>
        <div style="width: 52px; height: 55%; border-radius: 10px; background: rgba(182,174,212,0.35);"></div>
        <div style="align-self: center; margin-left: 18px; font-size: 26px; color: var(--texto-suave);">esa barrita corta<br>es lo que vende →</div>
      </div>
    </div>

    <div class="header-slide">
      <span style="font-size: 26px; color: var(--texto-suave);">@potenc.ia__</span>
      <span class="deslizar">cuánto es, en números <span class="flecha">→</span></span>
