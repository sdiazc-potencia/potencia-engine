<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Slide 1 — Portada</title>
<link rel="stylesheet" href="../../../design/fonts.css">
<link rel="stylesheet" href="../../../design/brand.css">
<style>
  .mini-matriz {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 12px;
    width: 340px; height: 240px;
  }
  .mini-celda {
    border-radius: 14px;
    background: rgba(59, 30, 118, 0.4);
    border: 1.5px solid rgba(193, 152, 248, 0.25);
  }
  .mini-celda.activa {
    background: linear-gradient(140deg, var(--violeta-vivo), rgba(141, 82, 255, 0.5));
    border-color: var(--lavanda);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 800;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="glow calido"></div>

    <div class="header-slide">
      <div class="wordmark">potenc<span class="ia">IA</span></div>
      <div class="tag">guardá esto</div>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 52px;">
      <h1 class="gancho">No sabés qué<br>automatizar primero.<br><span class="highlight">Esta matriz decide.</span></h1>

      <div style="display: flex; align-items: center; gap: 36px;">
        <div class="mini-matriz">
          <div class="mini-celda activa">ACÁ</div>
          <div class="mini-celda"></div>
          <div class="mini-celda"></div>
          <div class="mini-celda"></div>
        </div>
        <p class="cuerpo" style="font-size: 30px; max-width: 420px;">2 preguntas, 4 cuadrantes, <strong>cero dudas.</strong></p>
      </div>
    </div>

    <div class="header-slide">
      <span style="font-size: 26px; color: var(--texto-suave);">@potenc.ia__</span>
      <span class="deslizar">el error de casi todos <span class="flecha">→</span></span>
    </div>
  </div>
</body>
</html>
