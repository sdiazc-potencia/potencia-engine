<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ad 4 — Herramientas sueltas</title>
<link rel="stylesheet" href="../../../design/fonts.css">
<link rel="stylesheet" href="../../../design/brand.css">
<style>
  .sueltas { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
  .suelta {
    font-size: 27px; font-weight: 700;
    color: var(--texto-suave);
    background: rgba(59, 30, 118, 0.35);
    border: 1.5px dashed rgba(182, 174, 212, 0.5);
    border-radius: 14px;
    padding: 16px 26px;
    position: relative;
  }
  .suelta .x { color: #ff6b6b; margin-right: 10px; font-weight: 800; }
</style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>

    <div class="header-slide">
      <div class="wordmark">potenc<span class="ia">IA</span></div>
      <div class="tag">la verdad incómoda</div>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 46px;">
      <h1 class="gancho" style="font-size: 84px;">Tus herramientas<br>no se hablan.<br><span class="highlight">Tu caja lo paga.</span></h1>

      <div class="sueltas">
        <span class="suelta"><span class="x">✕</span>el chatbot que nadie configuró</span>
        <span class="suelta"><span class="x">✕</span>el CRM que nadie carga</span>
        <span class="suelta"><span class="x">✕</span>la planilla que nadie mira</span>
        <span class="suelta"><span class="x">✕</span>el "sistema" que es un Excel</span>
      </div>

      <p class="cuerpo" style="font-size: 34px; text-align: center;">No necesitás otra herramienta.<br><strong>Necesitás un circuito que las conecte.</strong></p>
    </div>

    <div style="display: flex; justify-content: center;">
      <div class="pill llena" style="font-size: 34px;">Conectá tu negocio →</div>
    </div>
  </div>
</body>
</html>
