<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ad 2 — Lead frío</title>
<link rel="stylesheet" href="../../../design/fonts.css">
<link rel="stylesheet" href="../../../design/brand.css">
</head>
<body>
  <div class="slide">
    <div class="glow"></div>

    <div class="header-slide">
      <div class="wordmark">potenc<span class="ia">IA</span></div>
      <div class="tag">está pasando ahora</div>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 44px;">
      <h1 class="gancho" style="font-size: 92px;">Tu lead esperó<br><span class="acento-italic">5 horas.</span><br><span class="highlight">Ya le compró a otro.</span></h1>

      <div class="barras" style="gap: 24px;">
        <div class="barra-fila">
          <div class="barra-head"><span>Vos: "ahora le contesto"</span><span class="valor">5-8 horas</span></div>
          <div class="barra-track"><div class="barra-fill apagada" style="width: 95%;"></div></div>
        </div>
        <div class="barra-fila">
          <div class="barra-head"><span>Tu agente de IA</span><span class="valor" style="color: var(--lavanda);">45 segundos</span></div>
          <div class="barra-track"><div class="barra-fill" style="width: 5%; min-width: 40px;"></div></div>
        </div>
      </div>
      <p class="cuerpo" style="font-size: 32px;">Responde, califica y agenda. <strong>A las 3 PM y a las 3 AM.</strong></p>
    </div>

    <div style="display: flex; justify-content: center;">
      <div class="pill llena" style="font-size: 34px;">No pierdo un lead más →</div>
    </div>
  </div>
</body>
</html>
