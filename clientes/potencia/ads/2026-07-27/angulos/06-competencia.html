<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ad 6 — La competencia</title>
<link rel="stylesheet" href="../../../design/fonts.css">
<link rel="stylesheet" href="../../../design/brand.css">
<style>
  .versus { display: flex; flex-direction: column; gap: 20px; }
  .lado {
    display: flex; justify-content: space-between; align-items: center;
    border-radius: 18px; padding: 30px 38px;
    font-size: 32px; font-weight: 700;
  }
  .lado .estado { font-size: 27px; font-weight: 500; }
  .ellos {
    background: linear-gradient(140deg, rgba(141, 82, 255, 0.4), rgba(59, 30, 118, 0.5));
    border: 1.5px solid var(--violeta-vivo);
  }
  .ellos .estado { color: var(--lavanda); }
  .vos {
    background: rgba(59, 30, 118, 0.3);
    border: 1.5px dashed rgba(182, 174, 212, 0.4);
    color: var(--texto-suave);
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>

    <div class="header-slide">
      <div class="wordmark">potenc<span class="ia">IA</span></div>
      <div class="tag activo">perdón por esto</div>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 46px;">
      <h1 class="gancho" style="font-size: 84px;">Tu competencia<br>ya respondió.<br><span class="highlight">Vos estás leyendo<br>este anuncio.</span></h1>

      <div class="versus">
        <div class="lado ellos">
          <span>Una pyme de tu rubro</span>
          <span class="estado">● responde en 45 seg, 24/7</span>
        </div>
        <div class="lado vos">
          <span>Tu WhatsApp de ventas</span>
          <span class="estado">visto, hace 3 horas</span>
        </div>
      </div>

      <p class="cuerpo" style="font-size: 32px;">No es más grande que vos. <strong>Solo arrancó antes. Y la diferencia se acumula todos los días.</strong></p>
    </div>

    <div style="display: flex; justify-content: center;">
      <div class="pill llena" style="font-size: 34px;">Emparejar la cancha →</div>
    </div>
  </div>
</body>
</html>
