<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ad 5 — Piloto automático</title>
<link rel="stylesheet" href="../../../design/fonts.css">
<link rel="stylesheet" href="../../../design/brand.css">
</head>
<body>
  <div class="slide">
    <div class="glow calido"></div>

    <div class="header-slide">
      <div class="wordmark">potenc<span class="ia">IA</span></div>
      <div class="tag">para dueños cansados</div>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 46px;">
      <h1 class="gancho" style="font-size: 82px;">Abriste tu negocio<br>para dirigirlo.<br>No para contestar<br>WhatsApps <span class="acento-italic">un domingo<br>a la noche.</span></h1>

      <div style="display: flex; align-items: center; gap: 26px;">
        <svg style="width: 110px; height: 132px; shape-rendering: crispEdges; flex: none;" viewBox="0 0 10 12">
          <rect x="4" y="0" width="1" height="1" fill="#c4b5fd"/>
          <rect x="4" y="1" width="1" height="1" fill="#7c3aed"/>
          <rect x="3" y="2" width="4" height="3" fill="#a78bfa"/>
          <rect x="3.5" y="3" width="1" height="1" fill="#1e1b3a"/>
          <rect x="5.5" y="3" width="1" height="1" fill="#1e1b3a"/>
          <rect x="2" y="5" width="6" height="4" fill="#7c3aed"/>
          <rect x="1" y="5" width="1" height="3" fill="#a78bfa"/>
          <rect x="8" y="3" width="1" height="3" fill="#a78bfa"/>
          <rect x="9" y="2" width="1" height="1" fill="#a78bfa"/>
          <rect x="3" y="9" width="1.5" height="3" fill="#5b21b6"/>
          <rect x="5.5" y="9" width="1.5" height="3" fill="#5b21b6"/>
        </svg>
        <p class="cuerpo" style="font-size: 36px;"><span class="highlight">El domingo lo cubre él.</span><br><strong>Tu negocio, en piloto automático.</strong></p>
      </div>
    </div>

    <div style="display: flex; justify-content: center;">
      <div class="pill llena" style="font-size: 34px;">Quiero mi domingo de vuelta →</div>
    </div>
  </div>
</body>
</html>
