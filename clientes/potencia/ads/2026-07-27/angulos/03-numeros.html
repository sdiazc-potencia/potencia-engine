<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ad 3 — Los números</title>
<link rel="stylesheet" href="../../../design/fonts.css">
<link rel="stylesheet" href="../../../design/brand.css">
<style>
  .fila-stat {
    display: flex; align-items: baseline; gap: 34px;
    border-bottom: 2px solid rgba(193, 152, 248, 0.25);
    padding-bottom: 26px;
  }
  .fila-stat .num {
    font-size: 130px; font-weight: 800; line-height: 1; letter-spacing: -0.03em;
    background: linear-gradient(100deg, var(--lavanda), var(--violeta-vivo));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    min-width: 380px;
  }
  .fila-stat .desc { font-size: 34px; line-height: 1.3; color: var(--blanco); font-weight: 500; }
</style>
</head>
<body>
  <div class="slide">
    <div class="glow sutil"></div>

    <div class="header-slide">
      <div class="wordmark">potenc<span class="ia">IA</span></div>
      <div class="tag activo">medido, no prometido</div>
    </div>

    <h1 class="gancho" style="font-size: 74px; margin: 40px 0 50px;">Esto no es<br>una promesa. <span class="highlight">Es la medición.</span></h1>

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 34px;">
      <div class="fila-stat">
        <span class="num">+60%</span>
        <span class="desc">de consultas atendidas<br>sin intervención humana</span>
      </div>
      <div class="fila-stat">
        <span class="num">2-4x</span>
        <span class="desc">más conversión<br>con la misma pauta</span>
      </div>
      <div class="fila-stat" style="border-bottom: none;">
        <span class="num">-15 hs</span>
        <span class="desc">semanales de tareas<br>que ahora corren solas</span>
      </div>
    </div>

    <div style="display: flex; justify-content: center;">
      <div class="pill llena" style="font-size: 34px;">Quiero estos números →</div>
    </div>
  </div>
</body>
</html>
