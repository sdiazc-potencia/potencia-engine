<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Patrón: Gráfico de barras</title>
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../brand.css">
</head>
<body>
  <div class="slide">
    <div class="glow sutil"></div>

    <div class="kicker" style="margin-bottom: 36px;">
      <span class="num">04 / 06</span>
      <span>— la comparación</span>
    </div>

    <h2 class="titulo" style="margin-bottom: 18px;">Tiempo de respuesta<br>a un lead <span class="acento-italic">nuevo.</span></h2>
    <p class="cuerpo" style="margin-bottom: 56px;">Después de la primera hora, la probabilidad de contacto cae 10 veces.</p>

    <div class="barras" style="flex: 1; justify-content: center;">
      <div class="barra-fila">
        <div class="barra-head"><span>Pyme promedio</span><span class="valor">5-8 horas</span></div>
        <div class="barra-track"><div class="barra-fill apagada" style="width: 92%;"></div></div>
      </div>
      <div class="barra-fila">
        <div class="barra-head"><span>Con vendedor "rápido"</span><span class="valor">1-2 horas</span></div>
        <div class="barra-track"><div class="barra-fill apagada" style="width: 38%;"></div></div>
      </div>
      <div class="barra-fila">
        <div class="barra-head"><span>Con agente de IA</span><span class="valor" style="color: var(--lavanda);">45 segundos</span></div>
        <div class="barra-track"><div class="barra-fill" style="width: 6%;"></div></div>
      </div>
      <p class="cuerpo" style="margin-top: 24px; font-size: 28px;">El agente responde, califica y agenda. <strong>A cualquier hora.</strong></p>
    </div>

    <div class="footer-marca"><span class="wordmark" style="font-size: 32px;">potenc<span class="ia">IA</span></span></div>
  </div>
</body>
</html>
