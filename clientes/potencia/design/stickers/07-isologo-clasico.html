<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sticker — Isologo clásico</title>
<link rel="stylesheet" href="../fonts.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .lienzo {
    width: 1024px; height: 1024px;
    display: flex; align-items: center; justify-content: center;
    font-family: "DM Sans", sans-serif;
  }
  .sticker {
    filter:
      drop-shadow(7px 0 0 #fff) drop-shadow(-7px 0 0 #fff)
      drop-shadow(0 7px 0 #fff) drop-shadow(0 -7px 0 #fff)
      drop-shadow(5px 5px 0 #fff) drop-shadow(-5px 5px 0 #fff)
      drop-shadow(5px -5px 0 #fff) drop-shadow(-5px -5px 0 #fff)
      drop-shadow(0 16px 22px rgba(13, 12, 43, 0.3));
  }
  .wordmark {
    font-size: 170px; font-weight: 800;
    letter-spacing: -0.03em; line-height: 1;
    color: #3b1e76;
  }
  .wordmark .ia { color: #c198f8; }
</style>
</head>
<body>
  <div class="lienzo">
    <div class="sticker">
      <div class="wordmark">potenc<span class="ia">IA</span></div>
    </div>
  </div>
</body>
</html>
