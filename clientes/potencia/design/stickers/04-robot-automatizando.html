<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sticker — Robot automatizando</title>
<link rel="stylesheet" href="../fonts.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .lienzo {
    width: 1024px; height: 1024px;
    display: flex; align-items: center; justify-content: center;
    font-family: "DM Sans", sans-serif;
  }
  .sticker {
    display: flex; flex-direction: column; align-items: center; gap: 34px;
    filter:
      drop-shadow(7px 0 0 #fff) drop-shadow(-7px 0 0 #fff)
      drop-shadow(0 7px 0 #fff) drop-shadow(0 -7px 0 #fff)
      drop-shadow(5px 5px 0 #fff) drop-shadow(-5px 5px 0 #fff)
      drop-shadow(5px -5px 0 #fff) drop-shadow(-5px -5px 0 #fff)
      drop-shadow(0 16px 22px rgba(13, 12, 43, 0.3));
  }
  svg { shape-rendering: crispEdges; }
  .robot { width: 430px; height: 516px; }
  .texto { font-size: 54px; font-weight: 800; color: #0d0c2b; }
  .barra {
    width: 520px; height: 44px;
    background: #0d0c2b;
    border-radius: 22px;
    padding: 8px;
    box-sizing: border-box;
  }
  .fill {
    width: 72%; height: 100%;
    border-radius: 14px;
    background: linear-gradient(90deg, #f59e0b, #fbbf24);
  }
</style>
</head>
<body>
  <div class="lienzo">
    <div class="sticker">
      <svg class="robot" viewBox="0 0 10 12">
        <rect x="2.5" y="0.5" width="5" height="1.5" fill="#fff"/>
        <rect x="3" y="2" width="4" height="3" fill="#fbbf24"/>
        <rect x="3.5" y="3" width="1" height="1" fill="#1e1b3a"/>
        <rect x="5.5" y="3" width="1" height="1" fill="#1e1b3a"/>
        <rect x="2" y="5" width="6" height="4" fill="#f59e0b"/>
        <rect x="1" y="5" width="1" height="3" fill="#fbbf24"/>
        <rect x="8" y="5" width="1" height="3" fill="#fbbf24"/>
        <rect x="3" y="9" width="1.5" height="3" fill="#b45309"/>
        <rect x="5.5" y="9" width="1.5" height="3" fill="#b45309"/>
      </svg>
      <div class="texto">automatizando…</div>
      <div class="barra"><div class="fill"></div></div>
    </div>
  </div>
</body>
</html>
