<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sticker — Cohete</title>
<link rel="stylesheet" href="../fonts.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .lienzo {
    width: 1024px; height: 1024px;
    display: flex; align-items: center; justify-content: center;
    font-family: "DM Sans", sans-serif;
  }
  .sticker {
    display: flex; flex-direction: column; align-items: center; gap: 34px;
    filter:
      drop-shadow(7px 0 0 #fff) drop-shadow(-7px 0 0 #fff)
      drop-shadow(0 7px 0 #fff) drop-shadow(0 -7px 0 #fff)
      drop-shadow(5px 5px 0 #fff) drop-shadow(-5px 5px 0 #fff)
      drop-shadow(5px -5px 0 #fff) drop-shadow(-5px -5px 0 #fff)
      drop-shadow(0 16px 22px rgba(13, 12, 43, 0.3));
  }
  svg { shape-rendering: crispEdges; }
  .cohete { width: 420px; height: 595px; transform: rotate(12deg); }
  .wordmark { font-size: 120px; font-weight: 800; letter-spacing: -0.03em; color: #0d0c2b; line-height: 1; }
  .wordmark .ia { color: #8d52ff; }
  .tag { font-size: 46px; font-weight: 700; font-style: italic; color: #7c3aed; margin-top: -8px; }
</style>
</head>
<body>
  <div class="lienzo">
    <div class="sticker">
      <svg class="cohete" viewBox="0 0 12 17">
        <rect x="5.5" y="0" width="1" height="1" fill="#c198f8"/>
        <rect x="5" y="1" width="2" height="1" fill="#c198f8"/>
        <rect x="4" y="2" width="4" height="8" fill="#f2effa"/>
        <rect x="4" y="2" width="1" height="8" fill="#ddd4f5"/>
        <rect x="5" y="3.5" width="2" height="2" fill="#8d52ff"/>
        <rect x="5.5" y="4" width="1" height="1" fill="#0d0c2b"/>
        <rect x="4" y="8.5" width="4" height="1" fill="#8d52ff"/>
        <rect x="2.5" y="7" width="1.5" height="3.5" fill="#7c3aed"/>
        <rect x="8" y="7" width="1.5" height="3.5" fill="#7c3aed"/>
        <rect x="4.5" y="10" width="3" height="1" fill="#3b1e76"/>
        <rect x="4.5" y="11" width="3" height="1.5" fill="#f59e0b"/>
        <rect x="5" y="12.5" width="2" height="1.5" fill="#fbbf24"/>
        <rect x="5.5" y="14" width="1" height="1.5" fill="#f59e0b"/>
      </svg>
      <div class="wordmark">potenc<span class="ia">IA</span></div>
      <div class="tag">modo despegue</div>
    </div>
  </div>
</body>
</html>
