<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sticker — Robot yo me encargo</title>
<link rel="stylesheet" href="../fonts.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .lienzo {
    width: 1024px; height: 1024px;
    display: flex; align-items: center; justify-content: center;
    font-family: "DM Sans", sans-serif;
  }
  .sticker {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    filter:
      drop-shadow(7px 0 0 #fff) drop-shadow(-7px 0 0 #fff)
      drop-shadow(0 7px 0 #fff) drop-shadow(0 -7px 0 #fff)
      drop-shadow(5px 5px 0 #fff) drop-shadow(-5px 5px 0 #fff)
      drop-shadow(5px -5px 0 #fff) drop-shadow(-5px -5px 0 #fff)
      drop-shadow(0 16px 22px rgba(13, 12, 43, 0.3));
  }
  svg { shape-rendering: crispEdges; }
  .globo {
    background: #c198f8;
    color: #0d0c2b;
    font-size: 58px; font-weight: 800;
    padding: 28px 52px;
    border-radius: 32px;
    position: relative;
  }
  .globo::after {
    content: "";
    position: absolute;
    bottom: -26px; left: 50%;
    transform: translateX(-50%);
    border: 16px solid transparent;
    border-top-color: #c198f8;
    border-bottom: none;
  }
  .robot { width: 460px; height: 552px; margin-top: 30px; }
</style>
</head>
<body>
  <div class="lienzo">
    <div class="sticker">
      <div class="globo">¡yo me encargo!</div>
      <svg class="robot" viewBox="0 0 10 12">
        <rect x="4" y="0" width="1" height="1" fill="#c4b5fd"/>
        <rect x="4" y="1" width="1" height="1" fill="#7c3aed"/>
        <rect x="3" y="2" width="4" height="3" fill="#a78bfa"/>
        <rect x="3.5" y="3" width="1" height="1" fill="#1e1b3a"/>
        <rect x="5.5" y="3" width="1" height="1" fill="#1e1b3a"/>
        <rect x="2" y="5" width="6" height="4" fill="#7c3aed"/>
        <rect x="1" y="5" width="1" height="3" fill="#a78bfa"/>
        <rect x="8" y="3" width="1" height="3" fill="#a78bfa"/>
        <rect x="9" y="2" width="1" height="1" fill="#a78bfa"/>
        <rect x="3" y="9" width="1.5" height="3" fill="#5b21b6"/>
        <rect x="5.5" y="9" width="1.5" height="3" fill="#5b21b6"/>
      </svg>
    </div>
  </div>
</body>
</html>
