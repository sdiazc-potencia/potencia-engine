<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Patrón: Dato / estadística</title>
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../brand.css">
</head>
<body>
  <div class="slide">
    <div class="glow"></div>

    <div class="kicker"><span class="num">03 / 07</span> el número que importa</div>

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
      <p class="stat">3,5</p>
      <p class="stat-label">tragos por invitado<br>en un evento de 5 horas</p>
      <p class="cuerpo" style="margin-top: 36px; max-width: 800px;">Es el promedio real que medimos en más de <b>400 eventos</b>. Si comprás por debajo de eso, la barra se queda seca antes del brindis.</p>
    </div>

    <div class="header-slide">
      <span class="contador"><span class="actual">03</span> / 07</span>
      <div class="wordmark chico"></div>
    </div>
  </div>
</body>
</html>
