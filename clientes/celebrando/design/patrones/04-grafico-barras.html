<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Patrón: Gráfico de barras</title>
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../brand.css">
</head>
<body>
  <div class="slide claro">
    <div class="glow sutil"></div>

    <div class="kicker"><span class="num">04 / 07</span> qué se toma más</div>

    <h2 class="titulo" style="margin: 34px 0 56px;">Consumo real<br>en casamientos</h2>

    <div class="barras">
      <div class="barra-fila">
        <div class="barra-head"><span>Gin tonic</span><span class="valor">34%</span></div>
        <div class="barra-track"><div class="barra-fill" style="width: 34%;"></div></div>
      </div>
      <div class="barra-fila">
        <div class="barra-head"><span>Fernet</span><span class="valor">27%</span></div>
        <div class="barra-track"><div class="barra-fill" style="width: 27%;"></div></div>
      </div>
      <div class="barra-fila">
        <div class="barra-head"><span>Espumante</span><span class="valor">21%</span></div>
        <div class="barra-track"><div class="barra-fill" style="width: 21%;"></div></div>
      </div>
      <div class="barra-fila">
        <div class="barra-head"><span>Cerveza</span><span class="valor">12%</span></div>
        <div class="barra-track"><div class="barra-fill apagada" style="width: 12%;"></div></div>
      </div>
      <div class="barra-fila">
        <div class="barra-head"><span>Sin alcohol</span><span class="valor">6%</span></div>
        <div class="barra-track"><div class="barra-fill apagada" style="width: 6%;"></div></div>
      </div>
    </div>

    <p class="cuerpo" style="font-size: 27px; margin-top: 46px;">Medido sobre <b>400+ eventos</b> de 100 a 300 invitados.</p>

    <div class="footer-marca"><div class="wordmark chico"></div></div>
  </div>
</body>
</html>
